[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  base = "apps/web"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://af-crm-production.up.railway.app"

[[redirects]]
  from = "/api/*"
  to = "https://af-crm-production.up.railway.app/api/:splat"
  status = 200
  force = true
